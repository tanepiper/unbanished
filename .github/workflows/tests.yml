# Formatting, Clippy (warnings are errors), the workspace's tests and the browser build, without
# the original game data (tests that need it skip). It runs only when started by hand (Actions →
# Tests → Run workflow, or `gh workflow run tests.yml`): the checks run on our own computers with
# tools/test/run.py, which has the game data and every suite, so GitHub's minutes are not spent
# on every push. The Release workflow does not run the tests.
name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: tests

      # The sound libraries' build scripts need the ALSA headers.
      - name: Install the ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --release --workspace --all-targets -- -D warnings
          cargo clippy --release -p unbanished-app --target wasm32-unknown-unknown -- -D warnings

      - name: Run the tests
        run: cargo test --workspace --release --no-fail-fast

      - name: Build the browser version
        run: RUSTFLAGS="-D warnings" cargo build --release -p unbanished-app --target wasm32-unknown-unknown
