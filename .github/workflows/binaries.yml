# Build the game for each system and attach a zip for each to a release. The Release workflow
# starts it after it tags a version; start it by hand to add builds to a release
# (`gh workflow run binaries.yml -f version=0.4.1`).
#
# It builds the tag vVERSION with the default features: Un-Banished More, every stable extension
# and no unstable one. Each zip holds the program, the launcher (unbanished-frame, GameFrame's
# frame in front of it; docs/develop/FRAME.md), the licences and a README. With dry_run it
# builds main and keeps the zips as the run's artifacts instead of attaching them.
name: Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The released version (X.Y.Z) whose tag to build'
        required: true
      dry_run:
        description: 'Dry run: build main and keep the zips with the run, attach nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, exe: unbanished.exe, frame: unbanished-frame.exe }
          - { os: macos-15, name: macos-arm64, exe: unbanished, frame: unbanished-frame }
          - { os: macos-15-intel, name: macos-x64, exe: unbanished, frame: unbanished-frame }
          - { os: ubuntu-latest, name: linux-x64, exe: unbanished, frame: unbanished-frame }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && 'main' || format('v{0}', inputs.version) }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: binaries-${{ matrix.name }}
          # The launcher is its own workspace, with its own target folder.
          workspaces: |
            . -> target
            apps/frame -> target

      # The sound libraries' build scripts need the ALSA headers. The launcher's web view
      # (Dioxus desktop, wry) needs WebKitGTK, GTK and libxdo.
      - name: Install the ALSA, WebKitGTK and libxdo headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Build the game
        shell: bash
        run: UNBANISHED_BUILD="$(git rev-parse --short=7 HEAD)" cargo build --release --locked -p unbanished-app --bin unbanished

      - name: Build the launcher
        shell: bash
        run: cargo build --release --locked --manifest-path apps/frame/Cargo.toml

      # The README names the program as it names itself (`--version`).
      - name: Make the zip
        shell: bash
        run: |
          dir="unbanished-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" "apps/frame/target/release/${{ matrix.frame }}" LICENSE-MIT LICENSE-APACHE "$dir/"
          {
            echo "$("target/release/${{ matrix.exe }}" --version) (${{ matrix.name }})"
            echo
            echo "A 1:1 reimplementation of Banished 1.0.7. It needs your own copy of Banished:"
            echo "see https://tanepiper.github.io/unbanished/guide/ to set it up."
            echo
            echo "Run '${{ matrix.frame }}' to open the launcher: choose Banished 1.0.7 (the"
            echo "original game) or Un-Banished (with its extensions), and your copy of Banished"
            echo "from Steam or a folder you choose, then press Start."
            echo
            echo "Or start the game directly:"
            echo "Run '${{ matrix.exe }}' to play Un-Banished More, with every extension."
            echo "Run '${{ matrix.exe }} --vanilla' to play the original game and its own mods only."
            echo
            echo "The programs are not signed. On macOS, allow them once with:"
            echo "  xattr -d com.apple.quarantine ${{ matrix.exe }} ${{ matrix.frame }}"
            echo "On Windows, SmartScreen may warn: choose More info, then Run anyway."
          } > "$dir/README.txt"
          cat "$dir/README.txt"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z a "$dir.zip" "$dir" >/dev/null; else zip -qr "$dir.zip" "$dir"; fi
          echo "ZIP=$dir.zip" >> "$GITHUB_ENV"

      - name: Attach the zip to the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: gh release upload "v$VERSION" "$ZIP" --clobber

      - name: Keep the zip with the run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
