# Release a version of Un-Banished. Started by hand (Actions → Release → Run workflow, or
# `gh workflow run release.yml -f version=0.2.0 -f next=0.3.0`). It checks the version, runs the
# tests and the browser build, then:
#   1. renames the changelog's Unreleased section to [VERSION] - DATE (its notes unchanged), puts a
#      new empty Unreleased section above it, and commits "Release VERSION";
#   2. tags that commit vVERSION (annotated);
#   3. sets the workspace version to NEXT and commits "Start NEXT development";
#   4. pushes both commits and the tag to main;
#   5. publishes a GitHub release from the tag, with the changelog section as its notes and a link
#      to the version's blog post (site/blog/*.md with `version: VERSION`), if there is one;
#   6. starts the Site workflow, so the website shows the new changelog and version;
#   7. builds the game, Un-Banished More (`unbanished`, with every stable extension and no
#      unstable one), on Windows, macOS (Apple silicon and Intel) and Linux, and attaches a zip
#      for each to the release.
# With dry_run, it does everything except push and publish, shows the release notes in the
# run's summary, and keeps the zips as the run's artifacts instead.
# The steps that edit files are in tools/release/release.py; AGENTS.md ("Versions") has the rules.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z); must be the version in Cargo.toml'
        required: true
      next:
        description: 'Next development version (X.Y.Z)'
        required: true
      dry_run:
        description: 'Dry run: check and prepare, but push and publish nothing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the version and the changelog
        run: python3 tools/release/release.py check "${{ inputs.version }}"

      - name: Check the next version
        run: |
          [[ "${{ inputs.next }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "next: not X.Y.Z"; exit 1; }

      - name: Install Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      # The sound libraries' build scripts need the ALSA headers.
      - name: Install the ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # Tests that need the original game data skip without it (game-data/ is never in the
      # repository), so this checks everything that can be checked without it.
      - name: Run the tests
        run: cargo test --workspace --release --no-fail-fast

      - name: Build the browser version
        run: RUSTFLAGS="-D warnings" cargo build --release -p unbanished-app --target wasm32-unknown-unknown

  release:
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NEXT: ${{ inputs.next }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set the commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Date the changelog and commit the release
        run: |
          python3 tools/release/release.py check "$VERSION"
          python3 tools/release/release.py changelog "$VERSION" "$(date -u +%F)"
          python3 tools/release/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          python3 tools/release/release.py title "$VERSION" > "$RUNNER_TEMP/title.txt"
          git add CHANGELOG.md
          git commit -m "Release $VERSION" -m "The changelog's Unreleased section is now [$VERSION]."
          git tag -a "v$VERSION" -m "$(cat "$RUNNER_TEMP/title.txt")"

      - name: Start the next version
        run: |
          python3 tools/release/release.py bump "$NEXT"
          git add Cargo.toml Cargo.lock
          git commit -m "Start $NEXT development" -m "The workspace version is now $NEXT (shown as $NEXT-<build> until its release)."

      - name: Show the release
        run: |
          {
            echo "## $(cat "$RUNNER_TEMP/title.txt")"
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "### Commits"
            echo
            git log --format='- %s' -2
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the commits and the tag
        if: ${{ !inputs.dry_run }}
        run: |
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v$VERSION" --verify-tag \
            --title "$(cat "$RUNNER_TEMP/title.txt")" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # Pushes made with the workflow's token start no other workflows, so start the site's.
      - name: Rebuild the website
        if: ${{ !inputs.dry_run }}
        run: gh workflow run site.yml --ref main

  # The game for each system, built from the release's tag (main in a dry run, which has no tag).
  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, exe: unbanished.exe }
          - { os: macos-15, name: macos-arm64, exe: unbanished }
          - { os: macos-15-intel, name: macos-x64, exe: unbanished }
          - { os: ubuntu-latest, name: linux-x64, exe: unbanished }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && 'main' || format('v{0}', inputs.version) }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: binaries-${{ matrix.name }}

      # The sound libraries' build scripts need the ALSA headers.
      - name: Install the ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # The default features: Un-Banished More, every stable extension, no unstable one.
      - name: Build the game
        shell: bash
        run: UNBANISHED_BUILD="$(git rev-parse --short=7 HEAD)" cargo build --release --locked -p unbanished-app --bin unbanished

      - name: Make the zip
        shell: bash
        run: |
          dir="unbanished-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" LICENSE-MIT LICENSE-APACHE "$dir/"
          {
            echo "Un-Banished More $VERSION (${{ matrix.name }})"
            echo
            echo "A 1:1 reimplementation of Banished 1.0.7. It needs your own copy of Banished:"
            echo "see https://tanepiper.github.io/unbanished/guide/ to set it up."
            echo
            echo "Run '${{ matrix.exe }}' to play Un-Banished More, with every extension."
            echo "Run '${{ matrix.exe }} --vanilla' to play the original game and its own mods only."
            echo
            echo "The program is not signed. On macOS, allow it once with:"
            echo "  xattr -d com.apple.quarantine ${{ matrix.exe }}"
            echo "On Windows, SmartScreen may warn: choose More info, then Run anyway."
          } > "$dir/README.txt"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z a "$dir.zip" "$dir" >/dev/null; else zip -qr "$dir.zip" "$dir"; fi
          echo "ZIP=$dir.zip" >> "$GITHUB_ENV"

      - name: Attach the zip to the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: gh release upload "v$VERSION" "$ZIP" --clobber

      - name: Keep the zip with the run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
