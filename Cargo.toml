[workspace]
resolver = "2"
members = ["crates/core", "crates/terrain", "crates/path", "crates/formats", "crates/wma", "crates/ui", "crates/game", "crates/gfx", "crates/audio", "crates/nexus", "crates/banishedinfo", "crates/mods", "crates/net", "crates/sim", "apps/viewer", "apps/cli", "apps/modmanager", "apps/game", "apps/relay"]

[workspace.package]
# The Un-Banished engine version (not the Banished game version, 1.0.7). Every crate inherits it;
# apps/game/build.rs adds the build id. AGENTS.md says when to change it.
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tanepiper/unbanished"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
