[workspace]
resolver = "2"
members = ["crates/formats", "crates/wma", "apps/viewer", "apps/cli"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tanepiper/banished-decompile"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
