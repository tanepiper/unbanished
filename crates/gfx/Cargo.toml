[package]
name = "banished-gfx"
version = "0.1.0"
description = "Shared wgpu rendering for the Banished apps: UI quads and texture upload"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
banished-formats = { path = "../formats" }
banished-ui = { path = "../ui" }
wgpu = { version = "30", features = ["webgl"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
