[package]
name = "unbanished-cli"
version.workspace = true
description = "Command-line tools for working with Banished game data"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unbanished-cli"
path = "src/main.rs"

[dependencies]
unbanished-formats = { path = "../../crates/formats" }
unbanished-nexus = { path = "../../crates/nexus", features = ["native"] }
unbanished-banishedinfo = { path = "../../crates/banishedinfo", features = ["native"] }
serde_json = "1"
