[package]
name = "unbanished-viewer"
version.workspace = true
description = "Model and texture viewer for Banished game data (native and WebGPU/WebGL2)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
unbanished-formats = { path = "../../crates/formats" }
unbanished-ui = { path = "../../crates/ui" }
unbanished-wma = { path = "../../crates/wma" }
unbanished-gfx = { path = "../../crates/gfx" }
unbanished-game = { path = "../../crates/game" }
unbanished-audio = { path = "../../crates/audio" }
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"
web-time = "1"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1"
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Location", "Element", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Event", "EventTarget", "Response", "UrlSearchParams"] }
console_error_panic_hook = "0.1"
console_log = "1"
