[package]
name = "unbanished-modmanager"
version.workspace = true
description = "The Un-Banished mod manager: turn mods on and off, set their order, keep mod lists, install from Nexus Mods and start the game"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "unbanished-mods"
path = "src/main.rs"

[dependencies]
unbanished-formats = { path = "../../crates/formats" }
unbanished-mods = { path = "../../crates/mods" }
unbanished-nexus = { path = "../../crates/nexus", features = ["native"] }
png = "0.18"
unbanished-banishedinfo = { path = "../../crates/banishedinfo", features = ["native"] }
eframe = "0.37.0"
