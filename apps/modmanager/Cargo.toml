[package]
name = "banished-modmanager"
version.workspace = true
description = "The Un-Banished mod manager: turn mods on and off, set their order, keep mod lists, install from Nexus Mods and start the game"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "banished-mods"
path = "src/main.rs"

[dependencies]
banished-mods = { path = "../../crates/mods" }
banished-nexus = { path = "../../crates/nexus", features = ["native"] }
png = "0.18"
eframe = "0.37.0"
