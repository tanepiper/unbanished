[package]
name = "banished-app"
version.workspace = true
description = "The Banished reimplementation: world generation and rendering on wgpu (native and web)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "banished"
path = "src/main.rs"

[dependencies]
banished-formats = { path = "../../crates/formats" }
banished-game = { path = "../../crates/game" }
banished-ui = { path = "../../crates/ui" }
banished-gfx = { path = "../../crates/gfx" }
banished-audio = { path = "../../crates/audio" }
banished-nexus = { path = "../../crates/nexus" }
banished-mods = { path = "../../crates/mods" }
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"
web-time = "1"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1"
png = "0.18"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
banished-nexus = { path = "../../crates/nexus", features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Location", "Element", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Event", "EventTarget", "Response", "UrlSearchParams", "Storage", "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "DomStringList", "Event", "BlobPropertyBag", "Url", "HtmlAnchorElement", "DragEvent", "DataTransfer", "Performance", "Headers", "Request", "RequestInit", "RequestMode"] }
console_error_panic_hook = "0.1"
console_log = "1"
