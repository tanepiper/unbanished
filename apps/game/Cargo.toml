[package]
name = "banished-app"
version = "0.1.0"
description = "The Banished reimplementation: world generation and rendering on wgpu (native and web)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "banished"
path = "src/main.rs"

[dependencies]
banished-formats = { path = "../../crates/formats" }
banished-game = { path = "../../crates/game" }
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"
web-time = "1"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1"
png = "0.18"
