[package]
name = "unbanished-app"
version.workspace = true
description = "The Banished reimplementation: world generation and rendering on wgpu (native and web)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "unbanished"
path = "src/main.rs"

# The extensions: what Un-Banished adds that Banished 1.0.7 does not have. Each one can be left
# out; with none of them the game builds and plays as with all of them (docs/develop/EXTENSIONS.md).
[features]
default = ["more"]
# Un-Banished More: every stable extension. The program and its releases are built with it;
# `--vanilla` turns all of them off for one run.
more = ["cinematic", "frame", "mod-sites", "multiplayer", "probe", "replay", "rule-hooks"]
# Extensions still in development: each is a feature named `unstable-NAME`, listed here, and is in
# no release. Build with `--features unstable` (all of them) or `--features unstable-NAME`. When
# one is stable, rename it and move it into `more`.
unstable = []
# GameFrame's frame: `unbanished --frame-io` answers the launcher in apps/frame
# (docs/develop/FRAME.md), native only.
frame = ["dep:gameframe-frame"]
# The cinematic camera for capture videos (`--camera`, `--camera-follow`), native only.
cinematic = []
# The probe: a query language to read and drive a running game (`--probe`, the browser's
# `window.unbanished`), for tests and scripts. See docs/develop/PROBE.md.
probe = []
# A Browse tab for each mod site (Nexus Mods, and banishedinfo.com natively) in the Mods window.
mod-sites = ["dep:unbanished-nexus", "dep:unbanished-banishedinfo"]
# Rule hooks: WebAssembly plugins from the player's Hooks folder that change the game.
rule-hooks = ["dep:unbanished-hooks"]
# Recordings: `--record` writes a game's commands and digests, `--replay` plays them back.
replay = []
# Multiplayer: lockstep games through a relay, the Multiplayer window, and their tests
# (`--lockstep-test`, `--net-test`, the browser's `?net=`).
multiplayer = [
    "replay",
    "dep:unbanished-net",
    "dep:unbanished-server",
    "unbanished-session/relay",
]

[dependencies]
unbanished-formats = { path = "../../crates/formats" }
unbanished-game = { path = "../../crates/game" }
unbanished-ui = { path = "../../crates/ui" }
unbanished-gfx = { path = "../../crates/gfx" }
unbanished-audio = { path = "../../crates/audio" }
unbanished-nexus = { path = "../../crates/nexus", optional = true }
unbanished-net = { path = "../../crates/net", optional = true }
unbanished-mods = { path = "../../crates/mods" }
unbanished-sim = { path = "../../crates/sim" }
unbanished-hooks = { path = "../../crates/hooks", optional = true }
unbanished-session = { path = "../../crates/session", default-features = false }
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"
web-time = "1"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1"
png = "0.18"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
unbanished-nexus = { path = "../../crates/nexus", features = ["native"], optional = true }
unbanished-net = { path = "../../crates/net", features = ["native"], optional = true }
unbanished-server = { path = "../server", optional = true }
unbanished-banishedinfo = { path = "../../crates/banishedinfo", features = ["native"], optional = true }
# GameFrame's frame contract, at the revision apps/frame uses.
gameframe-frame = { git = "https://github.com/tanepiper/game-frame", rev = "05068f7f71d13f2032fdc369e08e791e9173e0a1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Location", "Element", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Event", "EventTarget", "Response", "UrlSearchParams", "Storage", "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "DomStringList", "Event", "BlobPropertyBag", "Url", "HtmlAnchorElement", "DragEvent", "DataTransfer", "Performance", "Headers", "Request", "RequestInit", "RequestMode", "Navigator", "StorageManager", "MediaQueryList"] }
console_error_panic_hook = "0.1"
console_log = "1"

[dev-dependencies]
unbanished-sim = { path = "../../crates/sim", features = ["test-support"] }
