[package]
name = "unbanished-server"
version.workspace = true
description = "The Un-Banished multiplayer relay: rooms with codes, passing the players' messages on"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "unbanished-server"
path = "src/main.rs"

[dependencies]
unbanished-net = { path = "../../crates/net" }
unbanished-session = { path = "../../crates/session", default-features = false }
unbanished-formats = { path = "../../crates/formats" }
tungstenite = "0.30"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
unbanished-net = { path = "../../crates/net", features = ["native"] }
